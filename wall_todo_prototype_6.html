<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Planificator de perete</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void: #05070C;

    --glass: rgba(255,255,255,0.06);
    --glass-strong: rgba(255,255,255,0.09);
    --glass-border: rgba(255,255,255,0.14);
    --glass-highlight: rgba(255,255,255,0.5);
    --line: rgba(255,255,255,0.10);

    --text-1: rgba(255,255,255,0.95);
    --text-2: rgba(255,255,255,0.62);
    --text-3: rgba(255,255,255,0.40);

    --accent: #F2A65A;
    --accent-soft: rgba(242,166,90,0.16);
    --done: #5EEAD4;
  }

  * { box-sizing: border-box; }

  html, body{
    margin:0; padding:0; width:100%; height:100%;
    background: var(--void);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  /* ---------- AMBIENT BACKGROUND (light source for the glass) ---------- */
  #ambient{
    position: fixed;
    inset: -10%;
    z-index: 0;
    overflow: hidden;
  }
  #ambient .blob{
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.55;
  }
  #ambient .b1{
    width: 46vw; height: 46vw;
    top: -12%; left: -8%;
    background: #2DD4BF;
    animation: drift1 46s ease-in-out infinite alternate;
  }
  #ambient .b2{
    width: 38vw; height: 38vw;
    bottom: -14%; left: 22%;
    background: #F2A65A;
    animation: drift2 52s ease-in-out infinite alternate;
  }
  #ambient .b3{
    width: 40vw; height: 40vw;
    top: 6%; right: -10%;
    background: #8B7CF6;
    animation: drift3 60s ease-in-out infinite alternate;
  }
  @keyframes drift1{ from{ transform: translate(0,0); } to{ transform: translate(6vw, 5vh); } }
  @keyframes drift2{ from{ transform: translate(0,0); } to{ transform: translate(-5vw, -6vh); } }
  @keyframes drift3{ from{ transform: translate(0,0); } to{ transform: translate(-4vw, 6vh); } }

  #board{
    position: relative;
    z-index: 1;
    display:flex;
    gap: clamp(14px, 1.6vw, 22px);
    width:100vw;
    height:100vh;
    padding: clamp(16px, 2vw, 28px);
  }

  /* ---------- GLASS BASE ---------- */
  .glass{
    position: relative;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    backdrop-filter: blur(28px) saturate(160%);
    box-shadow:
      inset 0 1px 0 var(--glass-highlight),
      inset 0 0 60px rgba(255,255,255,0.03),
      0 20px 50px rgba(0,0,0,0.35);
  }
  .glass::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius: inherit;
    background: linear-gradient(135deg, rgba(255,255,255,0.16), rgba(255,255,255,0) 45%);
    pointer-events:none;
  }

  /* ---------- TODAY PANEL ---------- */
  .today-panel{
    flex: 1 1 66%;
    background: var(--glass-strong);
    border-radius: 28px;
    color: var(--text-1);
    display:flex;
    flex-direction:column;
    padding: clamp(20px,3vw,44px) clamp(24px,4vw,56px);
    min-width: 0;
  }

  .today-header{
    display:flex;
    align-items: baseline;
    gap: clamp(14px,1.6vw,24px);
    border-bottom: 1px solid var(--line);
    padding-bottom: clamp(14px,1.8vh,22px);
    margin-bottom: clamp(14px,2vh,22px);
    flex-shrink:0;
  }

  .today-header .day-name{
    font-family:'Fraunces', serif;
    font-weight: 500;
    font-size: clamp(2.6rem, 6vw, 5.2rem);
    line-height: 1;
    letter-spacing: -0.01em;
    color: var(--text-1);
  }

  .today-header .day-date{
    font-size: clamp(1rem, 1.6vw, 1.4rem);
    color: var(--text-2);
    font-weight: 500;
    white-space: nowrap;
  }

  .today-header .header-right{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap: clamp(10px,1.4vw,18px);
  }

  .orar-btn{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size: clamp(0.85rem, 1.1vw, 1rem);
    color: var(--text-1);
    background: var(--glass);
    border: 1px solid var(--glass-border);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    padding: 8px 18px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s ease, transform .15s ease;
  }
  .orar-btn:active{ transform: scale(0.95); }

  .today-header .clock{
    font-variant-numeric: tabular-nums;
    font-size: clamp(1.4rem, 2.4vw, 2.1rem);
    font-weight: 600;
    color: var(--text-1);
    white-space: nowrap;
  }

  .agenda{
    flex:1;
    overflow-y: auto;
    display:flex;
    flex-direction:column;
    min-height:0;
  }

  .agenda::-webkit-scrollbar{ width:0; }

  .task-row{
    display:flex;
    align-items:flex-start;
    gap: clamp(14px,1.6vw,26px);
    padding: clamp(10px,1.5vh,16px) 0;
    border-bottom: 1px solid var(--line);
  }

  .task-row .t-time{
    flex: 0 0 auto;
    width: clamp(56px,5vw,80px);
    font-weight:600;
    font-variant-numeric: tabular-nums;
    color: var(--text-2);
    font-size: clamp(1rem,1.3vw,1.25rem);
    padding-top: 2px;
  }

  .task-row .t-dot{
    flex:0 0 auto;
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 3px solid var(--text-2);
    margin-top: 2px;
    margin-left: 4px;
    cursor: pointer;
    transition: background .15s, border-color .15s, transform .1s;
  }
  .task-row .t-dot:active{
    transform: scale(0.88);
  }

  .task-row.done .t-dot{
    background: var(--done);
    border-color: var(--done);
  }

  .task-row .t-text{
    flex: 1;
    min-width: 0;
    font-size: clamp(1.15rem, 1.7vw, 1.55rem);
    font-weight: 500;
    line-height:1.3;
    padding-top:1px;
    color: var(--text-1);
  }

  .task-row.done .t-text{
    color: var(--text-3);
    text-decoration: line-through;
    text-decoration-color: var(--done);
  }

  /* ---------- SARCINA "SOON" (sub o ora pana la moment) ---------- */
  .task-row.soon{
    position: relative;
  }
  .task-row.soon::before{
    content:"";
    position:absolute;
    inset: -2px -18px;
    border-radius: 12px;
    z-index:-1;
    animation: soonGlow 2.2s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes soonGlow{
    0%, 100%{
      background: rgba(255,107,74,0);
      box-shadow: 0 0 0 rgba(255,107,74,0);
    }
    50%{
      background: rgba(255,107,74,0.14);
      box-shadow: 0 0 26px rgba(255,107,74,0.35);
    }
  }
  .task-row.soon .t-time{
    animation: soonTime 2.2s ease-in-out infinite;
  }
  .task-row.soon .t-text{
    animation: soonText 2.2s ease-in-out infinite;
  }
  @keyframes soonTime{
    0%, 100%{ color: var(--text-2); }
    50%{ color: #FF6B4A; }
  }
  @keyframes soonText{
    0%, 100%{ color: var(--text-1); }
    50%{ color: #FF6B4A; }
  }

  .now-marker{
    display:flex;
    align-items:center;
    gap: 10px;
    margin: 2px 0;
  }
  .now-marker .line{
    flex:1;
    height:2px;
    background: var(--accent);
  }
  .now-marker .label{
    font-size: 0.78rem;
    font-weight:700;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 3px 9px;
    border-radius: 20px;
    letter-spacing: 0.02em;
  }

  .empty-note{
    color: var(--text-2);
    font-size: 1.1rem;
    padding-top: 8px;
    font-style: italic;
  }

  /* ---------- WEEK RAIL ---------- */
  .week-rail{
    flex: 0 0 clamp(230px, 26vw, 340px);
    background: transparent;
    display:flex;
    flex-direction:column;
    gap: clamp(10px,1.4vh,14px);
    overflow-y:auto;
  }

  .rail-day{
    background: var(--glass);
    border-radius: 18px;
    padding: clamp(10px,1.4vh,14px) clamp(12px,1.4vw,16px);
    flex: 1 1 0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    min-height:0;
    cursor: pointer;
    transition: background .2s ease, transform .2s ease;
  }
  .rail-day:active{
    transform: scale(0.97);
  }

  .rail-day .rail-top{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom: 6px;
  }

  .rail-day .rail-abbr{
    font-weight:700;
    font-size: 0.82rem;
    color: var(--text-1);
    letter-spacing: 0.03em;
  }

  .rail-day .rail-date{
    font-size: 0.78rem;
    color: var(--text-2);
  }

  .rail-day .rail-count{
    margin-left:auto;
    font-size: 0.72rem;
    color: var(--text-2);
    font-variant-numeric: tabular-nums;
  }

  .rail-day .rail-preview{
    font-size: 0.86rem;
    color: var(--text-2);
    line-height:1.4;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .rail-day .rail-preview span{
    color: var(--text-1);
  }

  /* ---------- DAY PREVIEW POPUP ---------- */
  #backdrop{
    position: fixed;
    inset: 0;
    z-index: 40;
    opacity: 0;
    pointer-events: none;
    background: rgba(5,7,12,0);
    -webkit-backdrop-filter: blur(0px);
    backdrop-filter: blur(0px);
    transition: background .3s ease, opacity .3s ease, backdrop-filter .3s ease, -webkit-backdrop-filter .3s ease;
  }
  #backdrop.show{
    background: rgba(5,7,12,0.45);
    opacity: 1;
    pointer-events: auto;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }

  #previewPanel{
    position: fixed;
    z-index: 41;
    background: var(--glass-strong);
    border: 1px solid var(--glass-border);
    -webkit-backdrop-filter: blur(34px) saturate(170%);
    backdrop-filter: blur(34px) saturate(170%);
    color: var(--text-1);
    border-radius: 18px;
    overflow: hidden;
    display:flex;
    flex-direction: column;
    box-shadow:
      inset 0 1px 0 var(--glass-highlight),
      0 30px 70px rgba(0,0,0,0.45);
    transition: top .32s cubic-bezier(.3,.85,.4,1),
                left .32s cubic-bezier(.3,.85,.4,1),
                width .32s cubic-bezier(.3,.85,.4,1),
                height .32s cubic-bezier(.3,.85,.4,1),
                border-radius .32s ease,
                opacity .22s ease .1s;
  }
  #previewPanel::before{
    content:"";
    position:absolute;
    inset:0;
    background: linear-gradient(135deg, rgba(255,255,255,0.16), rgba(255,255,255,0) 45%);
    pointer-events:none;
  }

  #previewPanel .preview-timer{
    height: 3px;
    background: var(--accent);
    width: 100%;
    transform-origin: left;
    flex-shrink:0;
    position: relative;
    z-index: 1;
  }
  #previewPanel .preview-timer.run{
    animation: countdown 6s linear forwards;
  }
  @keyframes countdown{
    from{ transform: scaleX(1); }
    to{ transform: scaleX(0); }
  }

  #previewPanel .preview-header{
    display:flex;
    align-items:baseline;
    gap: 16px;
    padding: 22px 30px 16px 30px;
    border-bottom: 1px solid var(--line);
    flex-shrink:0;
    position: relative;
    z-index: 1;
  }
  #previewPanel .preview-header .p-name{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size: 2.6rem;
    line-height:1;
    color: var(--text-1);
  }
  #previewPanel .preview-header .p-date{
    font-size: 1.05rem;
    color: var(--text-2);
    font-weight:500;
  }
  #previewPanel .preview-body{
    flex:1;
    overflow-y:auto;
    padding: 6px 30px 20px 30px;
    position: relative;
    z-index: 1;
  }
  #previewPanel .preview-body .task-row .t-text{
    font-size: 1.25rem;
  }

</style>
</head>
<body>

<div id="ambient">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>

<div id="board">
  <div class="today-panel glass">
    <div class="today-header">
      <div class="day-name" id="dayName">—</div>
      <div class="day-date" id="dayDate">—</div>
      <div class="header-right">
        <button id="orarBtn" class="orar-btn">Orar Școlar</button>
        <div class="clock" id="clock">--:--</div>
      </div>
    </div>
    <div class="agenda" id="agenda"></div>
  </div>

  <div class="week-rail" id="weekRail"></div>
</div>

<div id="backdrop"></div>
<div id="previewPanel" style="display:none;">
  <div class="preview-timer" id="previewTimer"></div>
  <div class="preview-header">
    <div class="p-name" id="previewName">—</div>
    <div class="p-date" id="previewDate">—</div>
  </div>
  <div class="preview-body" id="previewBody"></div>
</div>

<script>
  // =====================================================================
  // CONFIG — completeaza aici linkul primit dupa ce publici Google Sheet-ul
  // ca Web App (vezi instructiunile). Cat timp e gol, ruleaza cu date demo.
  // =====================================================================
  const CONFIG = {
    JSONBIN_URL: "https://api.jsonbin.io/v3/b/6aa5666bac6210605ac4e128/latest",
    JSONBIN_KEY: "$2a$10$1mXmKUJZ0chI143MykPnsejEW.ZvMp3WUKBYiim.BP8zNPlAXDAXC",
    REFRESH_MINUTES: 1           // la cate minute verifica din nou sursa de date
  };

  const dayNames = ["Duminică","Luni","Marți","Miercuri","Joi","Vineri","Sâmbătă"];
  const dayAbbr  = ["DU","LU","MA","MI","JO","VI","SÂ"];
  const monthNames = ["ianuarie","februarie","martie","aprilie","mai","iunie","iulie","august","septembrie","octombrie","noiembrie","decembrie"];

  // ---------- ORAR SCOLAR (implicit, folosit doar daca jsonbin nu are inca orar salvat) ----------
  const DEFAULT_ORAR = {
    1: [
      {ora:"12:30 - 13:20", materie:"Matematică", prof:"Zaharia Elena"},
      {ora:"13:30 - 14:20", materie:"Opțional Spaniolă", prof:"Gavrila Adelina"},
      {ora:"14:30 - 15:20", materie:"Dirigenție", prof:"Ionescu Ionela"},
      {ora:"15:30 - 16:20", materie:"Matematică", prof:"Zaharia Elena"},
      {ora:"16:30 - 17:20", materie:"Geografie", prof:"Lazăr Iancu"},
    ],
    2: [
      {ora:"12:30 - 13:20", materie:"Matematică", prof:"Zaharia Elena"},
      {ora:"13:30 - 14:20", materie:"Ed. Fizică", prof:"Ilie Sebastian"},
      {ora:"14:30 - 15:20", materie:"Română", prof:"Ionescu Ionela"},
      {ora:"15:30 - 16:20", materie:"Istorie", prof:"Marin Cristina"},
      {ora:"16:30 - 17:20", materie:"TIC", prof:"Chiriță Nicoleta"},
      {ora:"17:30 - 18:20", materie:"Engleză", prof:"Linca Sorina"},
    ],
    3: [
      {ora:"13:30 - 14:20", materie:"Educație Socială", prof:"Pîrvulescu Oana"},
      {ora:"14:30 - 15:20", materie:"Română", prof:"Ionescu Ionela"},
      {ora:"15:30 - 16:20", materie:"Engleză", prof:"Linca Sorina"},
      {ora:"16:30 - 17:20", materie:"Tehnologie", prof:"Andrei Simona"},
      {ora:"17:30 - 18:20", materie:"Ed. Muzicală", prof:"Tănase Ingrid"},
    ],
    4: [
      {ora:"12:30 - 13:20", materie:"Biologie", prof:"Sin Raluca"},
      {ora:"13:30 - 14:20", materie:"Spaniolă", prof:"Gavrila Adelina"},
      {ora:"14:30 - 15:20", materie:"Ed. Fizică", prof:"Ilie Sebastian"},
      {ora:"15:30 - 16:20", materie:"Istorie", prof:"Marin Cristina"},
      {ora:"16:30 - 17:20", materie:"Română", prof:"Ionescu Ionela"},
    ],
    5: [
      {ora:"12:30 - 13:20", materie:"Matematică", prof:"Zaharia Elena"},
      {ora:"13:30 - 14:20", materie:"Română", prof:"Ionescu Ionela"},
      {ora:"14:30 - 15:20", materie:"Religie", prof:"Vulpe Alina"},
      {ora:"15:30 - 16:20", materie:"Spaniolă", prof:"Gavrila Adelina"},
      {ora:"16:30 - 17:20", materie:"Ed. Plastică", prof:"Nițescu Mihaela"},
    ],
  };

  let ORAR = DEFAULT_ORAR;   // suprascris de datele din jsonbin, daca exista
  let VACANTE = [];          // {inceput:"AAAA-LL-ZZ", sfarsit:"AAAA-LL-ZZ", nume:"..."}[]

  // taskStore: cheie "AAAA-LL-ZZ" -> lista de {t:"HH:MM", x:"text"}
  let taskStore = {};
  const doneState = {}; // in-memory toggle state per "dateKey-index"

  function pad(n){ return String(n).padStart(2,"0"); }

  function dateKey(d){
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
  }

  function fmtDate(d){
    return d.getDate() + " " + monthNames[d.getMonth()];
  }

  function minutesOf(timeStr){
    const [h,m] = timeStr.split(":").map(Number);
    return h*60+m;
  }

  function tasksFor(d){
    const list = (taskStore[dateKey(d)] || []).slice();
    const auto = autoSchoolTasksFor(d);
    return list.concat(auto).sort((a,b)=>minutesOf(a.t)-minutesOf(b.t));
  }

  // genereaza automat "Scoala Amalia" (la prima ora) si "De luat Amalia" (dupa ultima ora),
  // pe baza orarului zilei respective — se opreste singur in perioadele de vacanta
  function autoSchoolTasksFor(d){
    const key = dateKey(d);
    if(isVacationOn(key)) return [];

    const periods = ORAR[d.getDay()];
    if(!periods || periods.length === 0) return [];

    const sorted = periods.slice().sort((a,b) => String(a.ora).localeCompare(String(b.ora)));
    const first = sorted[0];
    const last = sorted[sorted.length - 1];
    const startTime = String(first.ora).split(" - ")[0].trim();
    const endTime = String(last.ora).split(" - ")[1]?.trim();
    if(!startTime || !endTime) return [];

    return [
      { t: startTime, x: "Școala Amalia" },
      { t: endTime, x: "De luat Amalia" }
    ];
  }

  // ---------- DATE DEMO (folosite doar daca SHEET_API_URL e gol / fetch esueaza) ----------
  function buildDemoStore(){
    const now = new Date();
    const demoByOffset = {
      0: [ {t:"07:00", x:"Sport"}, {t:"09:00", x:"Call cu clientul"}, {t:"12:30", x:"Prânz"}, {t:"15:00", x:"Plată facturi"}, {t:"19:00", x:"Gătit cină"}, {t:"21:00", x:"Citit"} ],
      1: [ {t:"09:00", x:"Ședință proiect"}, {t:"14:00", x:"Interviu"}, {t:"18:30", x:"Curs de engleză"} ],
      2: [ {t:"08:00", x:"Sport"}, {t:"11:00", x:"Deadline raport"}, {t:"19:00", x:"Ieșire cu prietenii"} ],
      3: [ {t:"10:00", x:"Curățenie"}, {t:"13:00", x:"Piață"}, {t:"17:00", x:"Vizită la părinți"} ],
      4: [ {t:"11:00", x:"Biserică"}, {t:"15:00", x:"Plimbare în parc"}, {t:"20:00", x:"Pregătire săptămână"} ],
      5: [ {t:"08:00", x:"Sport"}, {t:"09:30", x:"Ședință echipă"}, {t:"13:00", x:"Prânz cu Andrei"}, {t:"18:00", x:"Cumpărături"} ],
      6: [ {t:"07:30", x:"Alergare"}, {t:"10:00", x:"Raport lunar"}, {t:"17:00", x:"Dentist"} ],
    };
    const store = {};
    for(let offset=0; offset<=6; offset++){
      const d = new Date(now);
      d.setDate(now.getDate() + offset);
      store[dateKey(d)] = demoByOffset[offset];
    }
    return store;
  }

  // ---------- INCARCARE DIN GOOGLE SHEET ----------
  // Se asteapta un JSON: [{ "data":"2026-09-12", "ora":"09:00", "sarcina":"Sport" }, ...]
  async function loadTaskStore(){
    if(!CONFIG.JSONBIN_URL){
      taskStore = buildDemoStore();
      return;
    }
    try{
      const res = await fetch(CONFIG.JSONBIN_URL, {
        cache: "no-store",
        headers: { "X-Master-Key": CONFIG.JSONBIN_KEY }
      });
      const payload = await res.json();
      const rec = payload.record;

      // rec poate fi fie array vechi (doar sarcini), fie noul obiect {tasks, orar, vacante}
      const rows = Array.isArray(rec) ? rec : (rec.tasks || []);
      const store = {};
      rows.forEach(r => {
        const key = String(r.data).trim();
        if(!store[key]) store[key] = [];
        store[key].push({ t: String(r.ora).trim(), x: String(r.sarcina).trim() });
      });
      taskStore = store;

      if(!Array.isArray(rec)){
        if(rec.orar && Object.keys(rec.orar).length > 0) ORAR = rec.orar;
        if(Array.isArray(rec.vacante)) VACANTE = rec.vacante;
      }
    }catch(err){
      console.warn("Nu am putut incarca din jsonbin, folosesc date demo.", err);
      if(Object.keys(taskStore).length === 0) taskStore = buildDemoStore();
    }
  }

  function isVacationOn(dateKeyStr){
    return VACANTE.some(v => dateKeyStr >= v.inceput && dateKeyStr <= v.sfarsit);
  }

  // ---------- RANDARE ----------
  function render(){
    const now = new Date();
    const nowMinutes = now.getHours()*60 + now.getMinutes();

    document.getElementById("dayName").textContent = dayNames[now.getDay()];
    document.getElementById("dayDate").textContent = fmtDate(now);
    document.getElementById("clock").textContent = pad(now.getHours()) + ":" + pad(now.getMinutes());

    // ascunde butonul de Orar automat, daca azi cade intr-o perioada de vacanta
    document.getElementById("orarBtn").style.display = isVacationOn(dateKey(now)) ? "none" : "";

    // ---- Agenda pentru azi ----
    const agenda = document.getElementById("agenda");
    agenda.innerHTML = "";
    const tasks = tasksFor(now);

    if(tasks.length === 0){
      agenda.innerHTML = '<div class="empty-note">Nimic planificat azi.</div>';
    }

    let markerInserted = false;
    tasks.forEach((task, i) => {
      if(!markerInserted && minutesOf(task.t) >= nowMinutes){
        agenda.appendChild(buildNowMarker(now));
        markerInserted = true;
      }
      agenda.appendChild(buildTaskRow(task, dateKey(now), i, minutesOf(task.t) - nowMinutes));
    });
    if(!markerInserted){
      agenda.appendChild(buildNowMarker(now));
    }

    // ---- Rail cu urmatoarele 6 zile ----
    const rail = document.getElementById("weekRail");
    rail.innerHTML = "";
    for(let offset=1; offset<=6; offset++){
      const d = new Date(now);
      d.setDate(now.getDate() + offset);
      rail.appendChild(buildRailDay(d.getDay(), d, tasksFor(d)));
    }
  }

  function buildNowMarker(now){
    const wrap = document.createElement("div");
    wrap.className = "now-marker";
    const label = pad(now.getHours()) + ":" + pad(now.getMinutes());
    wrap.innerHTML = `<div class="label">acum · ${label}</div><div class="line"></div>`;
    return wrap;
  }

  function buildTaskRow(task, dKey, i, minutesUntil){
    const row = document.createElement("div");
    row.className = "task-row";
    const key = dKey + "-" + i;
    if(doneState[key]) row.classList.add("done");
    if(!doneState[key] && minutesUntil > 0 && minutesUntil <= 60) row.classList.add("soon");

    row.innerHTML = `
      <div class="t-time">${task.t}</div>
      <div class="t-text">${task.x}</div>
      <div class="t-dot"></div>
    `;
    row.querySelector(".t-dot").addEventListener("click", () => {
      doneState[key] = !doneState[key];
      row.classList.toggle("done");
      if(row.classList.contains("done")) row.classList.remove("soon");
    });
    return row;
  }

  function buildRailDay(idx, date, tasks){
    const card = document.createElement("div");
    card.className = "rail-day glass";
    const preview = tasks.slice(0,2).map(t => `<span>${t.t}</span> ${t.x}`).join(" · ");
    card.innerHTML = `
      <div class="rail-top">
        <div class="rail-abbr">${dayAbbr[idx]}</div>
        <div class="rail-date">${fmtDate(date)}</div>
        <div class="rail-count">${tasks.length} sarcini</div>
      </div>
      <div class="rail-preview">${preview || "—"}</div>
    `;
    card.addEventListener("click", () => openDayPreview(card, idx, date, tasks));
    return card;
  }

  // ---------- DAY PREVIEW POPUP ----------
  const backdrop = document.getElementById("backdrop");
  const panel = document.getElementById("previewPanel");
  const timerBar = document.getElementById("previewTimer");
  let closeTimeoutId = null;
  let isOpen = false;

  function targetRect(){
    const margin = Math.min(window.innerWidth, window.innerHeight) * 0.08;
    return {
      top: margin,
      left: margin,
      width: window.innerWidth - margin*2,
      height: window.innerHeight - margin*2
    };
  }

  function openDayPreview(cardEl, idx, date, tasks){
    if(isOpen) return; // un singur preview activ o dată
    isOpen = true;
    clearTimeout(closeTimeoutId);

    const startRect = cardEl.getBoundingClientRect();

    // populeaza continutul
    document.getElementById("previewName").textContent = dayNames[idx];
    document.getElementById("previewDate").textContent = fmtDate(date);
    const body = document.getElementById("previewBody");
    body.innerHTML = "";
    if(tasks.length === 0){
      body.innerHTML = '<div class="empty-note">Nimic planificat.</div>';
    } else {
      tasks.forEach(task => {
        const row = document.createElement("div");
        row.className = "task-row";
        row.innerHTML = `
          <div class="t-time">${task.t}</div>
          <div class="t-text">${task.x}</div>
          <div class="t-dot" style="cursor:default;"></div>
        `;
        body.appendChild(row);
      });
    }

    runPreviewAnimation(startRect);
  }

  document.getElementById("orarBtn").addEventListener("click", openOrarPreview);

  function openOrarPreview(){
    if(isOpen) return;
    isOpen = true;
    clearTimeout(closeTimeoutId);

    const btn = document.getElementById("orarBtn");
    const startRect = btn.getBoundingClientRect();
    const now = new Date();
    const periods = ORAR[now.getDay()] || [];

    document.getElementById("previewName").textContent = "Orar Școlar";
    document.getElementById("previewDate").textContent = dayNames[now.getDay()];
    const body = document.getElementById("previewBody");
    body.innerHTML = "";

    if(periods.length === 0){
      body.innerHTML = '<div class="empty-note">Nu sunt ore azi.</div>';
    } else {
      periods.forEach(p => {
        const row = document.createElement("div");
        row.className = "task-row";
        row.innerHTML = `
          <div class="t-time" style="width:auto; flex:0 0 auto; margin-right:4px;">${p.ora}</div>
          <div class="t-text">${p.materie}<div style="font-size:0.8rem; font-weight:400; color:var(--text-2); margin-top:2px;">${p.prof}</div></div>
        `;
        body.appendChild(row);
      });
    }

    runPreviewAnimation(startRect);
  }

  function runPreviewAnimation(startRect){
    panel.style.transition = "none";
    panel.style.top = startRect.top + "px";
    panel.style.left = startRect.left + "px";
    panel.style.width = startRect.width + "px";
    panel.style.height = startRect.height + "px";
    panel.style.borderRadius = "18px";
    panel.style.display = "flex";
    panel.classList.remove("collapsed");
    document.getElementById("previewBody").style.opacity = "0";
    document.querySelector(".preview-header").style.opacity = "0";
    timerBar.classList.remove("run");
    timerBar.style.transform = "scaleX(1)";

    backdrop.classList.add("show");

    requestAnimationFrame(() => {
      panel.style.transition = "";
      const rect = targetRect();
      panel.style.top = rect.top + "px";
      panel.style.left = rect.left + "px";
      panel.style.width = rect.width + "px";
      panel.style.height = rect.height + "px";
      panel.style.borderRadius = "26px";

      setTimeout(() => {
        const body = document.getElementById("previewBody");
        const header = document.querySelector(".preview-header");
        body.style.transition = "opacity .25s ease";
        header.style.transition = "opacity .25s ease";
        body.style.opacity = "1";
        header.style.opacity = "1";
        timerBar.classList.add("run");
      }, 180);
    });

    closeTimeoutId = setTimeout(() => closeDayPreview(startRect), 6000);
  }

  function closeDayPreview(startRect){
    timerBar.classList.remove("run");
    document.querySelector(".preview-header").style.opacity = "0";
    document.getElementById("previewBody").style.opacity = "0";
    backdrop.classList.remove("show");

    panel.style.top = startRect.top + "px";
    panel.style.left = startRect.left + "px";
    panel.style.width = startRect.width + "px";
    panel.style.height = startRect.height + "px";
    panel.style.borderRadius = "18px";

    setTimeout(() => {
      panel.style.display = "none";
      isOpen = false;
    }, 340);
  }

  backdrop.addEventListener("click", () => {
    if(!isOpen) return;
    clearTimeout(closeTimeoutId);
    const rect = targetRect(); // nu mai avem cardul original la indemana, revenim spre centru micsorat
    closeDayPreview({
      top: rect.top + rect.height*0.35,
      left: rect.left + rect.width*0.35,
      width: rect.width*0.3,
      height: rect.height*0.3
    });
  });

  // ---------- PORNIRE ----------
  async function boot(){
    await loadTaskStore();
    render();
  }
  boot();

  setInterval(render, 30000); // reimprospatare ceas + linia "acum" la 30s
  setInterval(async () => { await loadTaskStore(); render(); }, CONFIG.REFRESH_MINUTES * 60000); // recitire din Sheet
</script>
